<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloader — Vortex</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="mode-orbit">

<!-- BLACKHOLE SPIRAL -->
<div class="vx-hole" id="vxHole">
  <svg viewBox="-90 -90 180 180">
    <g fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round">
      <path class="spiral-arm" pathLength="100" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
      <path class="spiral-arm" pathLength="100" transform="rotate(60)" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
      <path class="spiral-arm" pathLength="100" transform="rotate(120)" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
      <path class="spiral-arm" pathLength="100" transform="rotate(180)" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
      <path class="spiral-arm" pathLength="100" transform="rotate(240)" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
      <path class="spiral-arm" pathLength="100" transform="rotate(300)" d="M 0 -80 A 80 80 0 0 1 80 0 A 70 70 0 0 1 0 70 A 60 60 0 0 1 -60 0 A 52 52 0 0 1 0 -52 A 45 45 0 0 1 45 0 A 39 39 0 0 1 0 39 A 34 34 0 0 1 -34 0 A 30 30 0 0 1 0 -30"/>
    </g>
    <circle class="pulse-ring p1" r="30"/>
    <circle class="pulse-ring p2" r="30"/>
    <circle class="pulse-ring p3" r="30"/>
    <circle class="pulse-ring p4" r="30"/>
    <circle class="photon-ring" r="26" fill="none" stroke="white" stroke-width="0.8" stroke-opacity="0.9"/>
    <circle r="24" fill="black"/>
  </svg>
</div>

<!-- TITLE -->
<div class="vx-title">
  <div class="vx-title-main">VORTEX</div>
  <div class="vx-title-sub">Downloader</div>
</div>

<!-- TABS -->
<div class="vx-tabs-wrap">
  <div class="vx-tabs">
    <button class="vx-tab active" data-filter="all">Semua</button>
    <button class="vx-tab" data-filter="video">Video</button>
    <button class="vx-tab" data-filter="audio">Audio</button>
    <button class="vx-tab" data-filter="file">File</button>
  </div>
</div>

<!-- CONTENT -->
<div class="content-area">
  <div class="orbit-stage" id="orbitStage">
    <div class="orbit-path orbit-path-inner"></div>
    <div class="orbit-path orbit-path-outer"></div>
    <div class="orbit-sun">
      <div class="sun-ring r1"></div>
      <div class="sun-ring r2"></div>
      <div class="sun-ring r3"></div>
      <div class="sun-ring r4"></div>
      <div class="sun-ring r5"></div>
      <div class="sun-core"></div>
    </div>
    <div class="orbit-ring inner" id="innerRing"></div>
    <div class="orbit-ring outer" id="outerRing"></div>
  </div>
  <div class="vx-grid" id="vxGrid"></div>
</div>

<!-- DOWNLOAD VIEW -->
<div class="download-view" id="downloadView">
  <div class="dl-container">
    <div class="dl-header">
      <button class="dl-back" id="dlBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="dl-platform">
        <div class="dl-platform-icon" id="dlIcon"></div>
        <div class="dl-platform-info">
          <div class="dl-platform-name" id="dlName">Platform</div>
          <div class="dl-platform-tag" id="dlTag">Video Version</div>
        </div>
      </div>
    </div>
    <div class="dl-card">
      <div class="dl-label">Link Media</div>
      <div class="dl-input-wrap">
        <svg class="dl-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <input type="text" class="dl-input" id="dlInput" placeholder="Tempel link di sini..." autocomplete="off" spellcheck="false">
      </div>
      <button class="dl-submit" id="dlSubmit" disabled>
        <span>Ambil Media</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
    <div class="dl-result" id="dlResult"></div>
  </div>
</div>

<!-- TYPE MODAL -->
<div class="type-modal" id="typeModal">
  <div class="type-modal-card">
    <div class="type-modal-title">Pilih Format</div>
    <div class="type-modal-sub" id="typeModalSub">Pilih tipe download</div>
    <div class="type-options" id="typeOptions"></div>
  </div>
</div>

<!-- MINI MUSIC BAR -->
<div class="mini-bar-wrap">
  <div class="mini-bar" id="miniBar">
    <div class="mini-icon" id="miniIcon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="mini-text" id="miniText">Music Menu</div>
    <div class="mini-eq" id="miniEq"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- MUSIC PANEL -->
<div class="music-panel-overlay" id="mpOverlay"></div>
<div class="music-panel" id="musicPanel">
  <div class="mp-handle"></div>
  <div class="mp-header">
    <div class="mp-header-title">Now Playing</div>
    <button class="mp-close" id="mpClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="mp-now">
    <div class="mp-now-cover" id="mpNowCover">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="mp-now-info">
      <div class="mp-now-title" id="mpNowTitle">Belum ada lagu</div>
      <div class="mp-now-artist" id="mpNowArtist">Pilih dari playlist</div>
    </div>
  </div>
  <div class="mp-controls">
    <button class="mp-ctrl" id="mpPrev">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="mp-play-btn" id="mpPlay">
      <svg id="mpIconPlay" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="6 4 20 12 6 20"/></svg>
      <svg id="mpIconPause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="mp-ctrl" id="mpNext">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 6h2v12h-2zm-11.5 6l8.5 6V6z"/></svg>
    </button>
  </div>
  <div class="mp-divider"></div>
  <div class="mp-list-label">Playlist</div>
  <div class="mp-list" id="mpList"></div>
</div>

<audio id="audioEl" preload="metadata"></audio>

<script type="module" src="/src/app-download.js"></script>
</body>
</html>
